name: CPU runtime preflight

on:
  push:
    paths: [".github/workflows/cpu-preflight.yml"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: cpu-preflight
  cancel-in-progress: true
jobs:
  cpu-install:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_CACHE_DIR: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare isolated CPU environment
        run: |
          set -euo pipefail
          uname -a
          df -h /
          test "$GITHUB_ACTIONS" = true
          df -h /
          test ! -e /opt/mimo-env
          sudo install -d -o "$(id -u)" -g "$(id -g)" /opt/mimo-env
          python -m venv /opt/mimo-env
          /opt/mimo-env/bin/python -m pip install --upgrade pip
      - name: Install public inference dependencies
        run: |
          /opt/mimo-env/bin/python -m pip install --report /tmp/base-install-report.json --only-binary=:all: --extra-index-url https://pypi.nvidia.com sglang==0.5.19 torch==2.13.0 flashinfer-python==0.6.18 sglang-kernel==0.4.6.post1 flash-attn-4==4.0.0b19 triton==3.7.1 av==16.1.0 pillow soundfile
      - name: Validate standard dependency consistency
        run: /opt/mimo-env/bin/python -m pip check
      - name: Install the published Transformers source revision
        run: |
          # Explicit isolated dependency override; CPU checks must pass.
          /opt/mimo-env/bin/python -m pip install --report /tmp/transformers-install-report.json --only-binary=tokenizers tokenizers==0.23.1 "https://github.com/huggingface/transformers/archive/f324707307757d9c0b8dac1c4462eceff911fa2f.zip"
      - name: Audit explicit compatibility overrides
        run: |
          /opt/mimo-env/bin/python - <<'PY'
          import subprocess, os, sys
          check=subprocess.run([sys.executable,'-m','pip','check'],capture_output=True,text=True)
          lines=[line for line in check.stdout.splitlines() if line.strip()]
          allowed=('sglang 0.5.19 has requirement transformers==5.12.1,','sglang 0.5.19 has requirement tokenizers==0.22.2,')
          unexpected=[line for line in lines if not line.startswith(allowed) and line!='No broken requirements found.']
          print(check.stdout)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              print('## Explicit metadata deviations',*lines,sep=chr(10),file=f)
          if unexpected: raise RuntimeError(unexpected)
          PY
      - name: CPU imports and image preprocessing
        run: |
          cat > /tmp/cpu-smoke.py <<'PY'
          import importlib, json, os, sys
          results=[]
          for name in ['torch','sglang','transformers','flashinfer','PIL','av','soundfile','torchaudio','torchvision']:
              try:
                  m=importlib.import_module(name)
                  results.append(dict(check='import '+name,ok=True,version=getattr(m,'__version__',None)))
              except Exception as e:
                  results.append(dict(check='import '+name,ok=False,error=str(e)))
          try:
              import torch
              assert torch.__version__=='2.13.0+cu130',torch.__version__
              assert not torch.cuda.is_available(),'Expected CPU-only runner'
              from transformers import AutoConfig, AutoTokenizer, AutoProcessor
              repo='XiaomiMiMo/MiMo-V2.6-Pro-MOPD'
              rev='adea8e2c5373181e5a973fa1ecb343cb31af214b'
              cfg=AutoConfig.from_pretrained(repo,revision=rev,code_revision=rev,trust_remote_code=True)
              results.append(dict(check='pinned config',ok=True,model_type=cfg.model_type))
              tok=AutoTokenizer.from_pretrained(repo,revision=rev,config=cfg,trust_remote_code=False)
              ids=tok.encode('A short CPU tokenizer test.',add_special_tokens=False)
              assert ids
              results.append(dict(check='tokenizer',ok=True,tokens=len(ids)))
              proc=AutoProcessor.from_pretrained(repo,revision=rev,config=cfg,trust_remote_code=False)
              from PIL import Image
              ip=getattr(proc,'image_processor',None)
              if ip is None: raise RuntimeError('No image_processor exposed')
              batch=ip(images=Image.new('RGB',(128,128),'blue'),return_tensors='pt')
              results.append(dict(check='image preprocessing',ok=True,keys=list(batch.keys())))
          except Exception as e:
              results.append(dict(check='checkpoint CPU checks',ok=False,error=str(e)))
          text=json.dumps(results,indent=2)
          print(text)
          summary=os.environ.get('GITHUB_STEP_SUMMARY')
          if summary:
              with open(summary,'a') as f:
                  print('## CPU checks (not GPU inference)',text,file=f)
          sys.exit(0 if all(r['ok'] for r in results) else 1)
          PY
          /opt/mimo-env/bin/python /tmp/cpu-smoke.py
      - name: Package the tested environment into a reusable image
        run: |
          set -euo pipefail
          context=/tmp/mimo-image-context
          mkdir -p "$context"
          prefix=$(python -c 'import sys; print(sys.base_prefix)')
          cp -a "$prefix" "$context/python"
          cp -a /opt/mimo-env "$context/env"
          cp /tmp/cpu-smoke.py "$context/cpu-smoke.py"
          cp /tmp/base-install-report.json /tmp/transformers-install-report.json "$context/"
          /opt/mimo-env/bin/python -m pip freeze > "$context/requirements.freeze.txt"
          cat > "$context/Dockerfile" <<'DOCKER'
          FROM ubuntu:24.04
          ARG PYTHON_PREFIX
          RUN apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates curl git openssh-server libgomp1 libgl1 libglib2.0-0t64 libsndfile1 libffi8 libssl3t64 zlib1g libbz2-1.0 liblzma5 libreadline8t64 libsqlite3-0 libncursesw6 libuuid1 ffmpeg && rm -rf /var/lib/apt/lists/*
          COPY python/ $PYTHON_PREFIX/
          COPY env/ /opt/mimo-env/
          COPY cpu-smoke.py requirements.freeze.txt base-install-report.json transformers-install-report.json /opt/mimo-runtime/
          ENV PATH=/opt/mimo-env/bin:$PYTHON_PREFIX/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          ENV LD_LIBRARY_PATH=$PYTHON_PREFIX/lib:/usr/local/nvidia/lib:/usr/local/nvidia/lib64
          ENV NVIDIA_VISIBLE_DEVICES=all NVIDIA_DRIVER_CAPABILITIES=compute,utility HF_HUB_DISABLE_TELEMETRY=1
          LABEL org.opencontainers.image.source="https://github.com/o500521/mimo-runtime-build-20261024"
          LABEL org.opencontainers.image.description="CPU-validated inference base. No weights or intervention enabled."
          CMD ["sleep","infinity"]
          DOCKER
          tag="cpu-$(echo "$GITHUB_SHA" | cut -c1-8)"
          image="ghcr.io/o500521/mimo-runtime-build-20261024:$tag"
          echo "$image" > /tmp/final-image-reference.txt
          docker build --build-arg PYTHON_PREFIX="$prefix" -t "$image" "$context"
          docker run --rm -e HF_HUB_OFFLINE=1 -v "$HOME/.cache/huggingface:/root/.cache/huggingface:ro" --entrypoint /opt/mimo-env/bin/python "$image" /opt/mimo-runtime/cpu-smoke.py
      - name: Publish reusable inference image
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          image=$(cat /tmp/final-image-reference.txt)
          docker push "$image"
          echo '## Reusable CPU-validated image' >> "$GITHUB_STEP_SUMMARY"
          echo "$image" >> "$GITHUB_STEP_SUMMARY"
          docker image inspect --format '{{json .RepoDigests}}' "$image" >> "$GITHUB_STEP_SUMMARY"
      - name: Record resolved environment
        if: always()
        run: |
          echo '## Resolved dependencies' >> "$GITHUB_STEP_SUMMARY"
          /opt/mimo-env/bin/python -m pip freeze >> "$GITHUB_STEP_SUMMARY"
          /opt/mimo-env/bin/python -m pip check || true
          echo 'No GPU rented; no model weights downloaded; no intervention installed or enabled.' >> "$GITHUB_STEP_SUMMARY"
