name: Free Linux diagnostic reproduction
on:
  push:
    paths: [".github/workflows/linux-diagnostics.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Prepare exact diagnostic source
        env:
          BOOTSTRAP_B64: 
          TEST_B64: 
        run: |
          mkdir -p /tmp/diag-tests /tmp/runtime-test /tmp/results
          python3 -c 'import os,base64,pathlib; pathlib.Path("/tmp/diag-tests/hf_jobs_bootstrap.py").write_bytes(base64.b64decode(os.environ["BOOTSTRAP_B64"])); pathlib.Path("/tmp/diag-tests/test_native_diagnostics.py").write_bytes(base64.b64decode(os.environ["TEST_B64"]))'
      - name: Prepare shared downloader and failure tests
        env:
          STAGER_B64: 
          STAGE_TEST_B64: 
        run: |
          python3 -c 'import os,base64,pathlib; pathlib.Path("/tmp/diag-tests/stage_main_weights.py").write_bytes(base64.b64decode(os.environ["STAGER_B64"])); pathlib.Path("/tmp/diag-tests/test_stage_main_weights.py").write_bytes(base64.b64decode(os.environ["STAGE_TEST_B64"]))'
      - name: Pull pinned runtime without GPUs
        run: docker pull ghcr.io/o500521/mimo-runtime-build-20261024@sha256:90847d1411c17fafe42eed2a0b22aaf7baf77072fb8150cb0fdbb5344e2f9dc1
      - name: Materialize the pinned Blackfrost overlay
        run: |
          docker run --rm -v /tmp/runtime-test:/work --entrypoint python ghcr.io/o500521/mimo-runtime-build-20261024@sha256:90847d1411c17fafe42eed2a0b22aaf7baf77072fb8150cb0fdbb5344e2f9dc1 -c 'from huggingface_hub import snapshot_download; import subprocess,sys; snapshot_download("Blackfrost-AI/MiMo-V2.6-Pro-MOPD-Derisking-Intervention-Runtime",revision="d78419fc559d20a1546083b4b099e7aca7cbfab6",local_dir="/work/runtime"); subprocess.run([sys.executable,"/work/runtime/scripts/verify_package.py","--root","/work/runtime"],check=True); subprocess.run([sys.executable,"/work/runtime/scripts/materialize_overlay.py","--output","/work/overlay"],check=True)'
      - name: External sampler regression with default container permissions
        run: |
          set -o pipefail
          timeout 100 docker run --rm -v /tmp/diag-tests:/tests:ro -v /tmp/runtime-test/overlay:/overlay:ro -v /tmp/runtime-test/runtime:/runtime:ro -e PYTHONPATH=/overlay -w /tests --entrypoint python ghcr.io/o500521/mimo-runtime-build-20261024@sha256:90847d1411c17fafe42eed2a0b22aaf7baf77072fb8150cb0fdbb5344e2f9dc1 -m unittest test_native_diagnostics test_stage_main_weights -v 2>&1 | tee /tmp/results/external-sampler.log
      - name: Verify eight real pinned shards over direct HTTPS on CPU
        env:
          PROBE_B64: 
          WEIGHTS_B64: 
        run: |
          python3 -c 'import os,base64,pathlib; pathlib.Path("/tmp/diag-tests/real_shard_probe.py").write_bytes(base64.b64decode(os.environ["PROBE_B64"])); pathlib.Path("/tmp/diag-tests/main-weight-manifest.json").write_bytes(base64.b64decode(os.environ["WEIGHTS_B64"]))'
          set -o pipefail
          timeout 600 docker run --rm -v /tmp/diag-tests:/tests:ro --entrypoint python ghcr.io/o500521/mimo-runtime-build-20261024@sha256:90847d1411c17fafe42eed2a0b22aaf7baf77072fb8150cb0fdbb5344e2f9dc1 /tests/real_shard_probe.py 2>&1 | tee /tmp/results/real-shard-probe.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-diagnostic-evidence
          path: /tmp/results
          retention-days: 7
