name: Free Linux diagnostic reproduction
on:
  push:
    paths: [".github/workflows/linux-diagnostics.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Prepare exact diagnostic source
        env:
          DIAGNOSTIC_B64: 
        run: |
          mkdir -p /tmp/diag /tmp/results
          python3 -c 'import os,base64,pathlib; pathlib.Path("/tmp/diag/sitecustomize.py").write_bytes(base64.b64decode(os.environ["DIAGNOSTIC_B64"]))'
      - name: Pull pinned runtime without GPUs
        run: docker pull ghcr.io/o500521/mimo-runtime-build-20261024@sha256:90847d1411c17fafe42eed2a0b22aaf7baf77072fb8150cb0fdbb5344e2f9dc1
      - name: Compare imports and launch help with diagnostics on and off
        run: |
          set +e
          for mode in 0 1; do
            timeout 100 docker run --rm --network none -v /tmp/diag:/diag:ro -e PYTHONPATH=/diag -e BLACKFROST_STACK_DIAGNOSTICS=$mode -e BLACKFROST_STACK_INTERVAL=1 --entrypoint python ghcr.io/o500521/mimo-runtime-build-20261024@sha256:90847d1411c17fafe42eed2a0b22aaf7baf77072fb8150cb0fdbb5344e2f9dc1 -c 'import ctypes; ctypes.PyDLL(None).sleep(3); import torch; import sglang.srt.entrypoints.http_server; print("IMPORT_OK", flush=True)' > /tmp/results/import-$mode.log 2>&1
            echo "import-$mode exit=$?" | tee -a /tmp/results/status.txt
            timeout 100 docker run --rm --network none -v /tmp/diag:/diag:ro -e PYTHONPATH=/diag -e BLACKFROST_STACK_DIAGNOSTICS=$mode -e BLACKFROST_STACK_INTERVAL=1 --entrypoint python ghcr.io/o500521/mimo-runtime-build-20261024@sha256:90847d1411c17fafe42eed2a0b22aaf7baf77072fb8150cb0fdbb5344e2f9dc1 -m sglang.launch_server --help > /tmp/results/help-$mode.log 2>&1
            echo "help-$mode exit=$?" | tee -a /tmp/results/status.txt
          done
          cat /tmp/results/status.txt >> "$GITHUB_STEP_SUMMARY"
          for log in /tmp/results/*.log; do echo "$log"; tail -30 "$log"; done
          ! grep -qE 'exit=[1-9]' /tmp/results/status.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-diagnostic-evidence
          path: /tmp/results
          retention-days: 7
