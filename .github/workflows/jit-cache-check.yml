name: Free pinned JIT cache check
on:
  push:
    paths: [".github/workflows/jit-cache-check.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Prepare CPU probe
        env:
          PROBE_B64: 
        run: |
          mkdir -p /tmp/cache-probe /tmp/cache-results
          chmod 777 /tmp/cache-results
          python3 -c 'import os,base64,pathlib; pathlib.Path("/tmp/cache-probe/probe.py").write_bytes(base64.b64decode(os.environ["PROBE_B64"]))'
      - name: Download and verify official pinned cache
        run: |
          curl -fL --retry 2 'https://github.com/flashinfer-ai/flashinfer/releases/download/v0.6.18/flashinfer_jit_cache-0.6.18%2Bcu130-cp39-abi3-manylinux_2_28_x86_64.whl' -o '/tmp/cache-probe/flashinfer_jit_cache-0.6.18+cu130-cp39-abi3-manylinux_2_28_x86_64.whl'
          echo '428a47a554ade93c30a818e142b781df58582bf056bab94611fb4c906cc366bf  /tmp/cache-probe/flashinfer_jit_cache-0.6.18+cu130-cp39-abi3-manylinux_2_28_x86_64.whl' | sha256sum -c -
      - name: Pull fixed image
        run: docker pull ghcr.io/o500521/mimo-runtime-build-20261024@sha256:90847d1411c17fafe42eed2a0b22aaf7baf77072fb8150cb0fdbb5344e2f9dc1
      - name: Load SM120 MoE and quantization binaries with JIT disabled
        run: |
          set -o pipefail
          timeout 240 docker run --rm -v /tmp/cache-probe:/probe:ro -v /tmp/cache-results:/results --entrypoint /bin/bash ghcr.io/o500521/mimo-runtime-build-20261024@sha256:90847d1411c17fafe42eed2a0b22aaf7baf77072fb8150cb0fdbb5344e2f9dc1 -c 'python -m pip install --no-deps /probe/flashinfer_jit_cache-0.6.18+cu130-cp39-abi3-manylinux_2_28_x86_64.whl && mkdir -p /tmp/driver-stub && ln -s /usr/local/cuda/lib64/stubs/libcuda.so /tmp/driver-stub/libcuda.so.1 && LD_LIBRARY_PATH=/tmp/driver-stub:$LD_LIBRARY_PATH python /probe/probe.py' 2>&1 | tee /tmp/cache-results/probe.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jit-cache-evidence
          path: /tmp/cache-results
          retention-days: 7
